<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — MobileStore</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="shell nav"><a class="logo" href="index.html"><span class="logo-mark">M</span>mobilestore</a><span class="muted">Secure checkout 🔒</span></header><main class="shell"><section class="page-title"><span class="eyebrow">Final step</span><h1>Make it yours.</h1><p>Enter your details and pay securely. This demo validates the form and creates a local order confirmation.</p></section><section class="checkout-layout"><form class="checkout-card" data-payment-form><h2>Payment details</h2><div class="field"><label for="email">Email address</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label for="name">Name on card</label><input id="name" required placeholder="Alex Morgan"></div><div class="field"><label for="card">Card number</label><input id="card" inputmode="numeric" minlength="12" required placeholder="4242 4242 4242 4242"></div><div class="two-col"><div class="field"><label for="expiry">Expiry</label><input id="expiry" required placeholder="MM / YY"></div><div class="field"><label for="cvv">Security code</label><input id="cvv" inputmode="numeric" minlength="3" required placeholder="123"></div></div><div class="field"><label for="address">Delivery address</label><input id="address" required placeholder="123 Market Street, San Francisco"></div><button class="primary full" type="submit">Pay securely →</button><p class="secure">This is a front-end demo; no real payment is processed.</p></form><aside class="summary"><h2>Order total</h2><div class="summary-row"><span>Items</span><span>In your cart</span></div><div class="summary-row summary-total"><span>Total</span><strong data-total>$0</strong></div><a href="cart.html">← Edit cart</a></aside></section></main><script src="app.js"></script></body></html>
